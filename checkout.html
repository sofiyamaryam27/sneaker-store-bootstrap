<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Sneaker Studio</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="checkout.css">

</head>

<body>

<div class="container py-5">

<h2 class="text-center mb-5">
💳 Checkout
</h2>

<div class="row">

<div class="col-lg-7">

<div class="card p-4 shadow">

<h4>Shipping Details</h4>

<input class="form-control my-3" placeholder="Full Name" required>

<input class="form-control my-3" placeholder="Phone Number" required>

<input class="form-control my-3" placeholder="Address" required>

<input class="form-control my-3" placeholder="City" required>

<input class="form-control my-3" placeholder="Pincode" required>

</div>

</div>

<div class="col-lg-5">

<div class="card p-4 shadow">

<h4>Payment Method</h4>

<div class="form-check mt-3">
<input class="form-check-input" type="radio" name="payment" checked>
<label class="form-check-label">
Cash on Delivery
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment">
<label class="form-check-label">
UPI
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="radio" name="payment">
<label class="form-check-label">
Credit / Debit Card
</label>
</div>

<button onclick="placeOrder()" class="btn btn-success w-100 mt-4">
Place Order
</button>

</div>

</div>

</div>

</div>

<script src="checkout.js"></script>

</body>

</html>
