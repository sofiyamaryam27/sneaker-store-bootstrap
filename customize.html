<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="customize.css">

</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">

<div class="container">

<a class="navbar-brand fw-bold logo" href="index.html">
👟 Sneaker <span>Studio</span>
</a>

<button class="navbar-toggler"
data-bs-toggle="collapse"
data-bs-target="#nav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav mx-auto">

<li class="nav-item">
<a class="nav-link" href="index.html">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="shop.html">Shop</a>
</li>

<li class="nav-item">
<a class="nav-link active" href="customize.html">Customize</a>
</li>

<li class="nav-item">
<a class="nav-link" href="contact.html">Contact</a>
</li>

</ul>

</div>

</div>

</nav>

<!-- Main -->

<section class="customize-section">

<div class="container">

<h1 class="text-center">
Customize Your Dream Sneaker
</h1>

<div class="row mt-5 align-items-center">

<!-- LEFT -->

<div class="col-lg-6">

<div class="preview-card">

<span class="new-badge">
NEW
</span>

<img id="shoeImage"
src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=900">

<h2 id="shoeName">
Nike Air Max
</h2>

<h3 id="shoePrice">
₹6999
</h3>

</div>

</div>

<!-- RIGHT -->

<div class="col-lg-6">

<div class="custom-card">

<h3>Customize</h3>

<label>Brand</label>

<select class="form-select mb-3" id="brandSelect">

<option>Nike</option>

<option>Adidas</option>

<option>Puma</option>

<option>Jordan</option>

<option>Reebok</option>

</select>

<label>Size</label>

<select class="form-select mb-3">

<option>6 UK</option>

<option>7 UK</option>

<option>8 UK</option>

<option>9 UK</option>

<option>10 UK</option>

</select>

<label>Material</label>

<select class="form-select mb-3">

<option>Leather</option>

<option>Canvas</option>

<option>Mesh</option>

<option>Suede</option>

</select>

<label>Shoe Color</label>

<div class="color-box">

<div class="color black" onclick="changeColor('#111')"></div>

<div class="color white" onclick="changeColor('#ffffff')"></div>

<div class="color red" onclick="changeColor('#ef4444')"></div>

<div class="color blue" onclick="changeColor('#2563eb')"></div>

<div class="color green" onclick="changeColor('#22c55e')"></div>

<div class="color yellow" onclick="changeColor('#facc15')"></div>

</div>

<label>Print Your Name</label>

<input
type="text"
class="form-control mb-4"
placeholder="Ex : Sofiya">

<div class="d-grid gap-3">

<button class="preview-btn">
Preview Design
</button>

<button class="cart-btn">
Add To Cart
</button>

<button class="buy-btn">
Buy Now
</button>

</div>

</div>

</div>

</div>

<!-- Features -->

<div class="row mt-5">

<div class="col-md-4">

<div class="feature-box">

<i class="fa-solid fa-palette"></i>

<h4>Unlimited Colors</h4>

<p>Create your own design.</p>

</div>

</div>

<div class="col-md-4">

<div class="feature-box">

<i class="fa-solid fa-cube"></i>

<h4>3D Preview</h4>

<p>See before you buy.</p>

</div>

</div>

<div class="col-md-4">

<div class="feature-box">

<i class="fa-solid fa-truck-fast"></i>

<h4>Fast Delivery</h4>

<p>Delivered within 3-5 days.</p>

</div>

</div>

</div>

</div>

</section>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="customize.js"></script>

</body>

</html>
